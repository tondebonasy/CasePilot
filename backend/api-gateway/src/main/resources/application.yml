server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: "tncybertech-auth"

spring:
  cloud:
    gateway:
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "*"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
      routes:
        - id: auth-login
          uri: http://localhost:8081
          order: -20
          predicates:
            - Path=/api/v1/auth/**
        - id: auth-admin-users
          uri: http://localhost:8081
          order: -10
          predicates:
            - Path=/api/v1/admin/users/**
          filters:
            - name: JwtHeaders
        - id: auth-service
          uri: http://localhost:8081
          order: -5
          predicates:
            - Path=/api/v1/users/**
          filters:
            - name: JwtHeaders
        - id: dispute-service
          uri: http://localhost:8084
          order: 0
          predicates:
            - Path=/api/v1/disputes/**,/api/v1/metrics/**,/api/v1/training/**,/api/v1/admin/**,/api/v1/notifications/**
          filters:
            - name: JwtHeaders

management:
  endpoints:
    web:
      exposure:
        include: health,info
