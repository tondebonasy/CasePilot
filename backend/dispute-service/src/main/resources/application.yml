server:
  port: 8084

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: "tncybertech-auth"
  deadlines:
    scan-ms: 10000

storage:
  root: "./storage"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/dispute_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 10MB
