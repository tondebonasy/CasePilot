server:
  port: 8081

app:
  jwt:
    secret: ${JWT_SECRET}
    issuer: "tncybertech-auth"
    accessTokenMinutes: 60
  seed:
    admin:
      enabled: ${SEED_ADMIN_ENABLED:false}
      email: "admin@casepilot.local"
      password: ${SEED_ADMIN_PASSWORD:}
      fullName: "Default Admin"

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.springframework.security: INFO
